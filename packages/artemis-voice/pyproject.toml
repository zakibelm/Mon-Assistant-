[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-voice"
version = "0.1.0"
description = "Voice control (Whisper) for Artemis Android automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The voice layer talks to the daemon through the zero-dependency remote SDK.
dependencies = ["artemis-client>=0.1.0"]

[project.optional-dependencies]
# Local, free speech-to-text (default provider).
local = ["faster-whisper>=1.0", "numpy>=1.26"]
# Live microphone capture on a desktop/laptop host.
mic = ["sounddevice>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
artemis-voice = "artemis_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artemis_voice = ["web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../artemis-client/src"]
