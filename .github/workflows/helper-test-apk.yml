name: Helper test APK

# Builds ArtemisAccessibilityHelper.apk from source and publishes it as a downloadable
# pre-release, so it can be installed from a phone or tablet without a computer.
# Test builds get a higher versionCode than the one in the repo (never committed), so they
# install over the bundled one. The bundled APK + helper_manifest.json stay untouched.

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/artemis-accessibility-helper/**"
      - ".github/workflows/helper-test-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # to attach the APK to a pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mark this as a test build (workspace only, not committed)
        working-directory: packages/artemis-accessibility-helper
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i "s/versionCode = [0-9]*/versionCode = ${CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.3.0-test.${GITHUB_RUN_NUMBER}\"/" app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Build
        working-directory: packages/artemis-accessibility-helper
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          bash build_apk.sh

      - name: Check the APK (signature, launcher screen)
        working-directory: packages/artemis-accessibility-helper
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose ArtemisAccessibilityHelper.apk | head -8
          "$BT/aapt2" dump badging ArtemisAccessibilityHelper.apk > badging.txt
          grep -E "^package|launchable-activity|targetSdkVersion|sdkVersion" badging.txt
          grep -q "launchable-activity: name='com.artemis.helper.MainActivity'" badging.txt \
            || { echo "::error::no launcher activity in the APK"; exit 1; }
          # Same key as the APK already installed, otherwise Android refuses the update
          # (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
          NEW="$("$BT/apksigner" verify --print-certs ArtemisAccessibilityHelper.apk | grep -m1 'SHA-256 digest')"
          KS="$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "APK cert: $NEW"
          echo "$NEW" | grep -qi "$KS" || { echo "::error::APK not signed with debug.keystore"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ArtemisAccessibilityHelper-test
          path: packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk

      - name: Publish as a pre-release (direct download from a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="helper-test-${GITHUB_RUN_NUMBER}"
          cp packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk /tmp/ArtemisAccessibilityHelper-test.apk
          gh release create "$TAG" /tmp/ArtemisAccessibilityHelper-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Helper test build #${GITHUB_RUN_NUMBER}" \
            --notes "Test build with a home screen (open the app, enable the service, run the self-test). Not the bundled release APK."
